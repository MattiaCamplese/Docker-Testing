services:
  app:
    build:
      context: .
      # In sviluppo: codice montato dal PC e riavvio automatico a ogni modifica
      # (nodemon in polling, perché i bind mount su Windows non propagano gli eventi)
      target: dev
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
    volumes:
      - ./src:/app/src
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:5173"
    environment:
      - VITE_USE_POLLING=true
      # Dentro la rete di Docker il backend si raggiunge col nome del servizio
      - API_URL=http://app:3000
    volumes:
      - ./frontend:/app
      # node_modules resta nel container (binari Linux), non sovrascritto dal bind mount
      - /app/node_modules
    # Parte solo quando l'API risponde davvero su /api/health (HEALTHCHECK nel Dockerfile)
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
