services:
  app:
    build: .
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:5173"
    environment:
      - VITE_USE_POLLING=true
    volumes:
      - ./frontend:/app
      # node_modules resta nel container (binari Linux), non sovrascritto dal bind mount
      - /app/node_modules
    restart: unless-stopped
